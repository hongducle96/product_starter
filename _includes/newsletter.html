<section class="newsletter" id="newsletter" aria-labelledby="nlTitle">
  <div class="art">{% include art-newsletter.html %}</div>
  <div class="body">
    <h2 id="nlTitle" style="font-size:28px">One Product lesson, every morning.</h2>
    <p class="muted">Short, plain-English lessons from the 100 Days of Product. No spam, unsubscribe anytime.</p>
    {% if site.newsletter_url != "" %}
    <div class="actions"><a class="btn btn-primary" href="{{ site.newsletter_url }}">Subscribe to the newsletter</a></div>
    {% else %}
    <form class="nl-form" id="nlForm" novalidate>
      <label class="sr-only" for="nlEmail">Email address</label>
      <input class="input" id="nlEmail" type="email" placeholder="you@example.com" autocomplete="email">
      <button class="btn btn-primary" type="submit">Subscribe</button>
    </form>
    <span class="help" id="nlMsg" role="status"></span>
    {% endif %}
  </div>
</section>
